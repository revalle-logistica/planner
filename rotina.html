<style>
.rt{
  --bg:#ECEDEF; --slide:#FFFFFF; --ink:#1E1E1E; --muted:#6B6F76; --line:#D5D8DC; --hl:#BDBDBD;
  --th:#000000; --th-ink:#FFFFFF; --zebra:#F2F2F2; --blue:#2F6FD6; --orange:#F2611D; --good:#12A33A; --bad:#E0141E; --warn:#E3A21A;
  --mapbg:#E6EEDF; --navy:#2B3A55;
  --f-title:"Open Sans","Segoe UI",Arial,sans-serif; --f-body:"Open Sans","Segoe UI",Arial,sans-serif; --f-tab:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
  color-scheme:light;
}
.rt *{box-sizing:border-box}
.rt{background:var(--bg);color:var(--ink);font-family:var(--f-body)}
.rt{font-size:14px}
.rt .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 16px}
.rt .bar .brand{font-weight:700;letter-spacing:.04em;font-size:13px;margin-right:auto}
.rt .ctl{display:flex;gap:6px;align-items:center;font-size:12px}
.rt .ctl label{opacity:.8}
.rt .ctl select,.rt .ctl button{font:600 12.5px var(--f-body);border-radius:6px;border:1px solid rgba(255,255,255,.22);background:#3A4B6B;color:#fff;padding:5px 8px}
.rt .ctl button[aria-pressed="true"]{background:rgba(255,255,255,0.030);color:var(--navy)}
.rt .ctl button:focus-visible,.rt .ctl select:focus-visible{outline:2px solid rgba(255,255,255,.10);outline-offset:1px}
.rt .nav button{font:600 12px var(--f-body);border:1px solid var(--line);background:rgba(255,255,255,0.030);border-radius:999px;padding:4px 10px;color:var(--muted);cursor:pointer}
.rt .nav button[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.rt .stage{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
.rt .slide{background:linear-gradient(135deg,rgba(255,255,255,0.030) 0%,rgba(255,255,255,0.030) 55%,rgba(255,255,255,0.055) 100%);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.12);padding:22px 26px 26px;min-height:640px;position:relative}
.rt .st{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.rt .st h1{font:300 clamp(24px,3.4vw,44px)/1.1 var(--f-title);text-transform:uppercase;margin:0;letter-spacing:.01em;text-wrap:balance}
.rt .st h1 span{background:var(--hl);padding:0 8px;font-weight:400}
.rt .st .ico{width:58px;height:58px;flex:none}
.rt .sub{font:400 22px var(--f-title);color:#CED7E5;display:flex;align-items:center;gap:6px;margin:-4px 0 10px}
.rt .sub:after{content:"";border-left:10px solid rgba(255,255,255,.22);border-top:9px solid transparent;border-bottom:9px solid transparent}
.rt .chip{position:absolute;right:26px;bottom:10px;font:600 11px var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.rt .row{display:grid;gap:16px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
.rt .row.eq{grid-template-columns:repeat(2,minmax(0,1fr))}
.rt .mapwrap{border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.10)}
.rt .maphead{background:var(--navy);color:#fff;font-size:13px;padding:8px 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rt .map svg{display:block;width:100%;height:auto;background:var(--mapbg)}
.rt .map text{font-family:var(--f-body)}
.rt .tbl{overflow-x:auto}
.rt table{border-collapse:collapse;font-family:var(--f-tab);font-size:13px;width:100%;font-variant-numeric:tabular-nums}
.rt th{background:var(--th);color:var(--th-ink);font-weight:700;padding:4px 6px;text-align:center;white-space:nowrap}
.rt td{padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.10);text-align:center;white-space:nowrap}
.rt td.l,.rt th.l{text-align:left}
.rt tbody tr:nth-child(even) td{background:var(--zebra)}
.rt tr.tot td{background:rgba(0,0,0,0.160)!important;color:#fff;font-weight:700}
.rt tr.sub2 td{background:rgba(255,255,255,0.059)!important;font-weight:600}
.rt .sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:5px}
.rt .lt{background:rgba(255,255,255,0.045)}
.rt .lt th{background:rgba(54,137,227,0.160);color:#E0E5EE;font-weight:600}
.rt .lt td{border-bottom:1px solid rgba(117,152,189,.35)}
.rt .lt tbody tr:nth-child(even) td{background:rgba(51,140,230,0.160)}
.rt .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.rt .tabs button{font:600 13px var(--f-body);padding:6px 12px;border:1px solid var(--line);background:rgba(255,255,255,0.030);border-radius:4px;cursor:pointer}
.rt .tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.rt .dash{background:rgba(0,0,0,0.160);border-radius:6px;padding:10px;display:grid;gap:10px;color:#fff}
.rt .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rt .tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.rt .tile{background:rgba(0,0,0,0.160);border:1px solid rgba(255,255,255,.22);border-radius:4px;padding:8px;text-align:center}
.rt .tile b{display:block;font:700 22px var(--f-tab)}
.rt .tile span{font-size:10.5px;color:#F2C14E}
.rt .dbox{background:rgba(0,0,0,0.160);border:1px solid rgba(255,255,255,.22);border-radius:4px;padding:6px}
.rt .dbox h4{margin:0 0 4px;font:600 11px var(--f-body);text-align:center;color:#ddd}
.rt .dbox svg text{font-family:var(--f-tab)}
.rt .kpitab td:first-child{text-align:left;font-style:italic}
.rt .kpitab input{width:64px;font:13px var(--f-tab);text-align:center;border:1px dashed rgba(255,255,255,.10);background:rgba(255,255,255,0.045);padding:1px 2px}
.rt .g{color:var(--good);font-weight:700}
.rt .r{color:var(--bad);font-weight:700}
.rt .charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rt .cbox{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,0.030);padding:6px 8px}
.rt .cbox h4{margin:0;font:italic 300 16px var(--f-title);text-align:center;color:#C6CFE0}
.rt .cbox svg{display:block;width:100%;height:auto}
.rt .cbox svg text{font-family:var(--f-body);font-size:10px;fill:#BDC8DB}
.rt .lg{display:flex;gap:12px;justify-content:center;font-size:11px;color:#BDC8DB}
.rt .lg i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.rt ul.opp{font:400 17px/1.45 var(--f-title);color:#D7DEEA;padding-left:22px;margin:6px 0}
.rt ul.opp li{margin-bottom:10px}
.rt ul.opp li::marker{color:#ABB9D2}
.rt [contenteditable="true"]{outline:1px dashed transparent}
.rt [contenteditable="true"]:hover{outline-color:rgba(255,255,255,.10)}
.rt [contenteditable="true"]:focus{outline:2px solid var(--blue);background:rgba(255,255,255,0.045)}
.rt .pa td{white-space:normal;font-size:12.5px;vertical-align:middle;border:1px solid rgba(255,255,255,.10)}
.rt .pa th{border:1px solid rgba(255,255,255,.22)}
.rt .pa td.st-Concluído{background:#0B9B1A!important;color:#fff}
.rt .pa td.st-Em\ andamento{background:#F5C518!important}
.rt .pa td.st-Atrasado{background:#E0141E!important;color:#fff}
.rt .pa td.st-Não\ iniciado{background:rgba(255,255,255,0.086)!important}
.rt .pa select{font:12px var(--f-tab);border:0;background:transparent;color:inherit}
.rt .btn{font:600 13px var(--f-body);border:1px solid var(--ink);background:rgba(255,255,255,0.030);padding:6px 12px;border-radius:4px;cursor:pointer}
.rt .btn.dark{background:var(--ink);color:#fff}
.rt .flow{display:grid;gap:10px;align-content:start}
.rt .fstep{display:flex;align-items:center;gap:10px}
.rt .fbox{background:#42BCD6;color:#fff;border-radius:8px;padding:10px 12px;width:170px;text-align:center;font-size:14px;line-height:1.2;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.rt .fown{font-size:12px;color:#CED7E5}
.rt .big3{display:grid;grid-template-columns:1fr 1.4fr 1fr 1fr 1fr;gap:18px;align-items:end}
.rt .bigc h4{font:400 17px var(--f-title);text-align:center;margin:0 0 6px;color:#CED7E5;min-height:42px}
.rt .bigc svg{width:100%;height:auto;display:block}
.rt .drop{border:2px dashed rgba(255,255,255,.10);border-radius:10px;padding:28px;text-align:center;background:rgba(255,255,255,0.036)}
.rt .drop.on{background:rgba(255,255,255,0.049);border-color:var(--blue)}
.rt .flist td{white-space:normal;text-align:left;font-family:var(--f-body);font-size:12.5px}
.rt .ok{color:var(--good);font-weight:700}
.rt .err{color:var(--bad);font-weight:700}
.rt .note{font-size:12.5px;color:var(--muted);line-height:1.45}
.rt .hidden{display:none}
.rt .cover{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:center;min-height:600px}
.rt .cover h1{font:300 clamp(40px,6vw,72px) var(--f-title);margin:0;letter-spacing:.02em}
.rt .cover p{font-size:18px;color:#C6CFE0;margin:6px 0 0}
.rt .pnav{display:flex;justify-content:space-between;margin-top:12px}
@media (max-width:900px){.rt .row,.rt .row.eq,.rt .cover,.rt .charts{grid-template-columns:1fr}
.rt .tiles{grid-template-columns:repeat(2,1fr)}
.rt .big3{grid-template-columns:repeat(2,1fr)}
.rt .slide{padding:16px 14px 30px;min-height:0}
.rt .nav{position:static}}
@media (prefers-reduced-motion:no-preference){.rt .slide{animation:fi .25s ease}
@keyframes fi{from{opacity:.4}to{opacity:1}}}
.rt .kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rt .kt{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,0.030);padding:10px 12px;display:grid;gap:6px;align-content:start}
.rt .kh{display:flex;align-items:center;gap:8px}
.rt .kh b{font-size:16px}
.rt .kn{background:rgba(0,0,0,0.160);color:#fff;font:700 11px var(--f-tab);padding:2px 6px}
.rt .pill2{margin-left:auto;font:700 11px var(--f-body);padding:2px 8px;border-radius:999px;background:rgba(255,255,255,0.050);color:#C6CFE0}
.rt .pill2.up{background:rgba(62,218,98,0.160);color:var(--good)}
.rt .pill2.dn{background:rgba(255,255,255,0.051);color:var(--bad)}
.rt .kv{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.rt .kv span{display:block;font-size:11px;color:var(--muted)}
.rt .kv b{font:700 22px var(--f-tab)}
.rt .kv .ar{color:#999;font-size:18px;padding-bottom:4px}
.rt .zmap{position:relative}
.rt .zmap svg{touch-action:none;user-select:none}
.rt .zbtn{position:absolute;right:8px;top:8px;display:grid;gap:4px}
.rt .zbtn button{width:30px;height:30px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,0.030);border-radius:4px;font:700 16px var(--f-body);cursor:pointer;color:#E0E5EE}
.rt .zbtn button:hover{background:rgba(255,255,255,0.045)}
.rt .zhint{position:absolute;left:8px;bottom:6px;font-size:11px;color:#C0CBDD;background:rgba(255,255,255,0.024);padding:1px 6px;border-radius:3px}
.rt .mapwrap:fullscreen{background:rgba(255,255,255,0.030);display:flex;flex-direction:column}
.rt .mapwrap:fullscreen .map{flex:1;display:flex}
.rt .mapwrap:fullscreen .zmap{flex:1}
.rt .mapwrap:fullscreen svg{height:100%;width:100%}
.rtab td{white-space:normal;vertical-align:top;padding:10px 8px;font-family:var(--f-body);font-size:13px;line-height:1.4}
.rtab .vk{display:inline-block;background:rgba(0,0,0,0.160);color:#fff;padding:3px 8px;font:700 14px var(--f-tab)}
.rt .rs{display:inline-block;font:700 12px var(--f-body);padding:3px 10px;border-radius:999px;margin-bottom:6px}
.rt .rs.ok{background:rgba(62,218,98,0.160);color:var(--good)}
.rt .rs.pa{background:rgba(255,192,26,0.160);color:#FFC952}
.rt .rs.no{background:rgba(255,255,255,0.051);color:var(--bad)}
.rt .ev{color:#D7DEEA}
.rt .lk{display:block;white-space:nowrap;border:0;background:none;color:var(--blue);font:600 12.5px var(--f-body);cursor:pointer;padding:2px 0;text-align:left}
.rt .lk:hover{text-decoration:underline}
.rt .score{display:inline-block;background:rgba(255,255,255,0.030);color:#F2F4F8;font:700 20px var(--f-tab);padding:0 10px;border-radius:4px;margin-right:6px}
.rt .rsbtn{font:700 12.5px var(--f-body);background:#F2C14E;color:#E2E7EF;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;box-shadow:0 0 0 3px rgba(242,193,78,.35)}
.rt .wgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.rt .wk{border:1px solid rgba(255,255,255,.10);padding:10px;position:relative;background:rgba(255,255,255,0.030)}
.rt .wk .dot{position:absolute;right:10px;top:10px;width:12px;height:12px;border-radius:50%}
.rt .wk .n{font-weight:700}
.rt .wk .v{font:700 24px var(--f-tab)}
.rt .wk .c{font-size:11px;color:var(--muted);line-height:1.4}
.rt .sug{border-top:1px solid rgba(255,255,255,.10);padding:9px 0;display:grid;gap:4px}
.rt .sug.off{opacity:.5}
.rt .sh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rt .so{font-size:13px;line-height:1.4}
.rt .sgb{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rt .sgb .btn{padding:3px 10px;font-size:12px}
.rt .tg{display:inline-block;font:700 11px var(--f-body);padding:2px 8px;border-radius:999px;background:rgba(255,255,255,0.045);color:#CED7E5}
.rt .tg.r{background:rgba(255,255,255,0.051);color:var(--bad)}
.rt .tg.y{background:rgba(255,192,26,0.160);color:#FFC952}
.rt .tg.g{background:rgba(62,218,98,0.160);color:var(--good)}
.rt .inp{width:100%;font:13px var(--f-body);border:1px solid rgba(255,255,255,.10);border-radius:4px;padding:5px 7px;margin:2px 0 6px}
.rt .lk2{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,0.030);border-radius:4px;cursor:pointer;margin:0 2px}
@media (max-width:900px){.rt .wgrid{grid-template-columns:repeat(2,1fr)}}
.rt{--side:#0E2350;--side2:#162E63;--hd1:#1D4ED8;--hd2:#2563EB;--bgc:#EEF2F8;--card:#fff;--ink:#14213D;--muted:#5B6782;--blue:#1D4ED8;--f-body:"Figtree","Segoe UI",Arial,sans-serif;--f-title:"Figtree","Segoe UI",Arial,sans-serif}
.rt{background:var(--bgc);font-family:var(--f-body)}
.rt .app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.rt .side{background:var(--side);color:#DCE4F5;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.rt .brandb{display:flex;gap:12px;align-items:center;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.10)}
.rt .logo{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,0.030);color:var(--side);display:grid;place-items:center;font:800 20px var(--f-body)}
.rt .brandb b{display:block;color:#fff;font-size:17px}
.rt .brandb small{font-size:11.5px;color:#AEBBD8}
.rt .snav{flex:1;overflow-y:auto;padding:10px 12px}
.rt .snav .sg{font:700 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:#8E9DC0;padding:16px 10px 6px}
.rt .snav button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;color:#DCE4F5;font:500 14.5px var(--f-body);padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left}
.rt .snav button:hover{background:rgba(255,255,255,0.002)}
.rt .snav button[aria-current="true"]{background:var(--side2);color:#fff;box-shadow:inset 3px 0 0 #fff}
.rt .sfoot{font-size:11.5px;color:#AEBBD8;padding:12px 18px;border-top:1px solid rgba(255,255,255,.10)}
.rt .mainc{min-width:0;display:flex;flex-direction:column}
.rt .hd{background:linear-gradient(90deg,var(--hd1),var(--hd2));color:#fff;display:flex;align-items:center;gap:16px;padding:16px 28px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.rt .ibtn{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,0.002);color:#fff;border-radius:10px;width:44px;height:40px;display:grid;place-items:center;cursor:pointer}
.rt .hdt h1{margin:0;font:800 24px var(--f-body)}

.rt .hdb{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.rt .hbtn{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,0.002);color:#fff;font:700 14px var(--f-body);border-radius:10px;padding:9px 16px;cursor:pointer}

.rt .ctl2{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}

.rt .seg2{display:inline-flex;border:1px solid rgba(123,145,183,.35);border-radius:10px;overflow:hidden}

<script>
/* ===== Casca do Planner Revalle para as telas da rotina =====
   Menu → ?m=<grupo>. Dados da rotina no Drive (rotina/estado.gz + rotina/meta.json),
   com cópia no navegador enquanto não muda. Preferências e plano de ação em rotina/ls.json. */
const GRUPOS={
  sem:{t:'Reunião semanal',ids:['sem']},
  alt:{t:'Alterações',ids:['mon','alt']},
  ind:{t:'Indicadores',ids:['ind','kdia','chk','res']},
  buf:{t:'Buffer',ids:['buf']},
  analise:{t:'Análise do planner',ids:['todos','setor','dia','pdvvol','num']},
  opp:{t:'Oportunidades',ids:['opp']},
  pa:{t:'Plano de ação',ids:['pa']},
  imp:{t:'Bases da rotina',ids:['imp']}};
let M=new URLSearchParams(location.search).get('m')||'sem';if(M==='opp')location.replace('oportunidades.html');if(M==='mon')M='alt';if(!GRUPOS[M])M='sem';
const EU=(window.PlannerAuth&&PlannerAuth.user())||{};
const IS_ADMIN=EU.perfil==='admin'||EU.perfil==='logistica';
let LSO={};
function avisoLeitura(){if(avisoLeitura.ok)return;avisoLeitura.ok=1;alertMsg('Só a Logística altera esta parte. Você pode consultar à vontade.')}
function grupoDe(id){for(const g in GRUPOS)if(GRUPOS[g].ids.includes(id))return g;return 'sem'}
function irPara(i){const s=SLIDES[i];if(!s)return;const g=grupoDe(s.id);if(g===M){UI.slide=i;render();window.scrollTo(0,0)}else if(g==='imp'||M==='imp')location.href='rotina.html?m='+g+'&s='+s.id;else{history.pushState({},'','rotina.html?m='+g+'&s='+s.id);irGrupo(g,s.id)}}
function grupoTabs(){const G=GRUPOS[M];const el=document.getElementById('gtabs');if(!el)return;
  const NOMES={mon:'📡 Monitor semanal',alt:'📊 Resumo das solicitações'};
  el.innerHTML=(M==='alt'&&PlannerAuth.can('alteracoes.html')?'<a href="alteracoes.html"><button>📝 Solicitações dos GVs</button></a>':'')+(G.ids.length>1?G.ids.map(id=>{const i=SLIDES.findIndex(s=>s.id===id);return `<button data-s="${i}" aria-pressed="${i===UI.slide}">${NOMES[id]||SLIDES[i].n}</button>`}).join(''):'');
  const t=document.getElementById('pgT');if(t)t.textContent=G.ids.length>1?G.t:SLIDES[UI.slide].n;
  const p=document.getElementById('pgS');if(p)p.textContent=SLIDES[UI.slide].sub}
// ---- gzip + base64 (o estado tem ~10 MB em JSON; comprimido fica ~1,5 MB)
function b64de(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64para(t){const s=atob(t);const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
async function gz(str){return b64de(await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer())}
async function gunz(t){return await new Response(new Blob([b64para(t)]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
function carregando(m){const s=document.getElementById('slide');if(s)s.innerHTML=`<div class="rload">${m}</div>`}
async function carregarEstado(meta){
  if(!meta){try{meta=JSON.parse(await PlannerData.text('rotina/meta.json'))}catch(e){return null}}
  carregando('Baixando os dados da rotina do Drive… (só na primeira vez ou quando houver atualização)');
  const z=await PlannerData.text('rotina/estado.gz');ESTZ=z;return JSON.parse(await gunz(z))}
// cache local do estado já completo: abre na hora e atualiza em segundo plano
function assinatura(){return Object.entries(ST.units||{}).map(([u,U])=>u+':'+Object.keys(U.planners||{}).sort().join(',')+':'+Object.keys(U.clients||{}).length).join('|')+'|'+(AJH||[]).length}
function guardarCache(v){try{IDB.set('rzc',{v,st:ST,ls:LSO,ajh:AJH})}catch(e){}}
let CACHE_V=null;
async function atualizarFundo(){
  try{let meta;try{meta=JSON.parse(await PlannerData.text('rotina/meta.json'))}catch(e){return}
    const ls=await carregarLS();let mudou=JSON.stringify(ls||{})!==JSON.stringify(LSO||{});LSO=ls||{};
    if(meta.v!==CACHE_V){const z=await PlannerData.text('rotina/estado.gz');ESTZ=z;ST=JSON.parse(await gunz(z));mudou=true}
    const a=assinatura();await completar();if(assinatura()!==a)mudou=true;
    const nv=meta.v!==CACHE_V;CACHE_V=meta.v;if(mudou||nv)guardarCache(meta.v);if(mudou)render()}catch(e){}}
async function carregarLS(){try{return JSON.parse(await PlannerData.text('rotina/ls.json'))}catch(e){return {}}}
function statusRotina(){const out={};for(const u in ST.units){const Uu=ST.units[u];const mk=Object.values(Uu.maps||{});
  const ped=Object.values(Uu.ped||{});
  out[u]={'0530':Object.keys(Uu.days||{}).sort().pop()||null,'1142':mk.filter(o=>o.km>0&&o.d).map(o=>o.d).sort().pop()||null,'1120':mk.filter(o=>o.pv>0&&o.d).map(o=>o.d).sort().pop()||null,
    ped:ped.length?dstr(Math.max(...ped.map(x=>x[1]))):null,vis:Object.keys(Uu.vis||{}).sort().pop()||null,jan:Object.keys(Uu.jan||{}).sort().pop()||null,
    cli:Object.keys(Uu.clients||{}).length,planners:Object.keys(Uu.planners||{})}}
  return {units:out,acoes:ST.acoes&&ST.acoes.em||null,impAt:ST.impAt||{},form:(ST.form||[]).length}}
async function salvarEstado(){
  try{ST.updated=new Date().toISOString();const v=ST.updated;const z=await gz(JSON.stringify(ST));
    if(!ESTZ){try{ESTZ=await PlannerData.text('rotina/estado.gz')}catch(e){}}
    if(ESTZ)await PlannerData.put('rotina/estado-anterior.gz',ESTZ);
    await PlannerData.put('rotina/estado.gz',z);ESTZ=z;await PlannerData.put('rotina/meta.json',JSON.stringify({v,status:statusRotina()}));
    CACHE_V=v;guardarCache(v);return `<div class="ok">✓ Salvo no Drive (${(z.length/1048576).toFixed(1)} MB) e já disponível para o time.</div>`}
  catch(e){return `<div class="err">✗ Não salvou no Drive: ${esc(e.message)}. Os números valem só até fechar a página.</div>`}}
async function iniciar(){
  if(M==='imp'&&!IS_ADMIN){location.replace('rotina.html?m=sem');return}
  document.getElementById('bImp').hidden=true;document.getElementById('bDir').hidden=!IS_ADMIN||M!=='imp';
  document.title=GRUPOS[M].t+' · Planner Revalle';
  IDB.del('rz');let rapido=false;
  if(M!=='imp'){const c=await IDB.get('rzc');if(c&&c.st&&c.st.units){ST=c.st;LSO=c.ls||{};AJH=c.ajh||[];CACHE_V=c.v;rapido=true}}
  if(!rapido){try{const meta=await PlannerData.text('rotina/meta.json').then(JSON.parse).catch(()=>null);const [ls,st]=await Promise.all([carregarLS(),meta?carregarEstado(meta):null]);LSO=ls||{};if(st)ST=st;if(ST&&ST.units&&Object.keys(ST.units).length)await completar();if(meta){CACHE_V=meta.v;guardarCache(meta.v)}}
  catch(e){carregando('Não consegui abrir os dados da rotina: '+esc(e.message));return}}
  const G=GRUPOS[M];const sp=new URLSearchParams(location.search).get('s');
  let i=SLIDES.findIndex(x=>x.id===sp);
  if(i<0)i=SLIDES[UI.slide]&&G.ids.includes(SLIDES[UI.slide].id)?UI.slide:SLIDES.findIndex(x=>x.id===G.ids[0]);
  instalarResumo();UI.slide=i;delete UI.wk; // a semana abre sempre na mais recente
  if(!UI.pInit){for(const u in ST.units){const ds=Object.keys(ST.units[u].planners||{});if(ds.length){UI.p=ds.sort((a,b)=>{const x=pd(a),y=pd(b);return (x.y*1e4+x.m*100+x.d)-(y.y*1e4+y.m*100+y.d)}).pop();UI.pInit=1;break}}}
  render();if(rapido)setTimeout(atualizarFundo,50)}
// ---- sem dados ainda: o administrador traz o HTML antigo (todo o histórico) ou importa as bases
function semDados(){grupoTabs();
  if(!IS_ADMIN)return `<div class="cbox" style="padding:18px"><b>Os dados da rotina ainda não foram carregados no sistema.</b><p class="note">Assim que a Logística importar as bases, esta tela aparece aqui.</p></div>`;
  return `<div class="cbox" style="padding:20px"><h3 style="margin:0 0 6px">Trazer o histórico para o sistema</h3>

function num(s){if(s==null)return NaN;s=String(s).trim();if(!s||s==='-')return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s)}

        const wb=XLSX.read(buf,{type:'array'});const A=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).slice(0,12).flat().map(String).join('|');

}

function strat(Uu,wk,Wd){const k=UI.stk||'icv',per=UI.stp||'1';const ws=Object.keys(Wd);const i=ws.indexOf(wk);const sel=per==='4'?ws.slice(Math.max(0,i-3),i+1):[wk];

    const VO=volOpp(Uu,wk,Wd);if(VO&&VO.weak.length){VO.weak.slice(0,2).forEach(w=>{const vis=DIAS[w.vd]==='Sáb'?'sábado':DIASF[w.vd].toLowerCase();

  if(k==='drop'){const sc=scenario(Uu,UI.p,(Uu.planners[UI.p]||{}).pos?'pos':'pre',dates());const vs={},ct={};(sc?sc.rows:[]).forEach(r=>{vs[r.c]=r.v;ct[r.c]=r.city});

  else if(/\.(csv|txt|xlsx|xls)$/i.test(e.name)&&!/^~\$/.test(e.name)){const f=await e.getFile();out.push({p:pre+e.name,f,h:e,k:f.size+'|'+f.lastModified})}}return out}
// várias pastas conectadas (ex.: rotina semanal + pasta de cada planner); cada uma lembra o que já foi importado
async function getDirs(){let D=(await IDB.get('dirs'))||[];const old=await IDB.get('dir');if(old&&!D.length){D=[old];await IDB.set('dirs',D);IDB.del('dir')}return D}
async function addDir(){if(!DIR_OK){alertMsg('Para conectar uma pasta, use o Chrome ou o Edge no computador.');return}
  try{const h=await window.showDirectoryPicker({id:'planner',mode:'read'});const D=await getDirs();for(const x of D){try{if(await x.isSameEntry(h)){alertMsg(`A pasta "${h.name}" já está conectada.`);return}}catch(e){}}
    D.push(h);await IDB.set('dirs',D);await syncDir()}catch(e){if(e.name!=='AbortError')alertMsg('Pasta: '+e.message)}}
async function delDir(i){const D=await getDirs();D.splice(i,1);await IDB.set('dirs',D);render()}
let DIRALL=[];
function dirTable(seen){if(!DIRALL.length)return '';const fmtD=t=>new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
  const rows=DIRALL.slice().sort((a,b)=>a.p.localeCompare(b.p)).map(x=>{const i=DIRALL.indexOf(x);const ok=seen[x.p]===x.k;return `<tr><td class="l">${esc(x.p)}</td><td>${fmtD(x.f.lastModified)}</td><td>${(x.f.size/1024).toFixed(0)} KB</td><td>${ok?'<span class="tg g">Importado</span>':'<span class="tg y">Novo / alterado</span>'}</td><td><button class="btn" data-reimp="${i}" style="padding:2px 8px">Importar de novo</button></td></tr>`}).join('');
  return `<details style="margin-top:8px"${UI.dirOpen?' open':''} id="dirDet"><summary class="note" style="cursor:pointer;font-weight:700">Ver os ${DIRALL.length} arquivos lidos nas pastas</summary><div class="tbl" style="max-height:340px;overflow:auto;margin-top:6px"><table class="stb"><thead><tr><th class="l">Arquivo</th><th>Modificado em</th><th>Tamanho</th><th>Situação</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
   <p class="note">A ferramenta reconhece arquivo alterado pela data de modificação e pelo tamanho. Se você trocou o arquivo e ele não aparece como "Novo / alterado", use "Importar de novo".</p></details>`}
async function runDirImport(list,seen,head){const msgs=[];const st=JSON.parse(JSON.stringify(ST));const bad=new Set();
  // arquivo sem data no nome dentro de pasta com data (ex.: "02.11.2026/Janela_Entrega_Alagoinhas.csv"): usa a data da pasta
  const withDate=x=>{const rx=/(\d{2})[.\-_](\d{2})[.\-_](20\d{2})/;if(rx.test(x.f.name))return x.f;const m=x.p.split('/').slice(0,-1).reverse().map(d=>d.match(rx)).find(Boolean);if(!m)return x.f;return new File([x.f],x.f.name.replace(/(\.[^.]+)$/,`_${m[1]}.${m[2]}.${m[3]}$1`),{lastModified:x.f.lastModified})};
  const t0=Date.now();const pg=(i,n,f)=>{const el=$('#impLog');if(el)el.innerHTML=`<div class="note" style="font-size:14px"><b>Importando ${i} de ${n}:</b> ${esc(f.name)} (${(f.size/1048576).toFixed(1)} MB) · ${Math.round((Date.now()-t0)/1000)} s</div><div class="sbar" style="margin-top:6px;max-width:420px"><i style="width:${Math.round((i-1)/n*100)}%;background:#2563EB"></i></div>`};
  await importFiles(list.map(withDate),st,m=>msgs.push(`<div class="ok">✓ ${esc(m)}</div>`),(f,e)=>{bad.add(f.replace(/_\d{2}\.\d{2}\.20\d{2}(\.[^.]+)$/,'$1'));bad.add(f);msgs.push(`<div class="err">✗ ${esc(f)}: ${esc(e)}</div>`)},pg);
  list.forEach(x=>{if(!bad.has(x.f.name))seen[x.p]=x.k});await IDB.set('dirSeen',seen);
  ST=st;msgs.push(await salvarEstado());
  render();$('#impLog').innerHTML=head+msgs.join('')+dirTable(seen);bindDirTable()}
function bindDirTable(){const d=$('#dirDet');if(d)d.ontoggle=()=>{UI.dirOpen=d.open};document.querySelectorAll('[data-reimp]').forEach(b=>b.onclick=async()=>{const x=DIRALL[+b.dataset.reimp];if(!x)return;b.textContent='Importando…';b.disabled=true;
  try{const f=await x.h.getFile();const y={...x,f,k:f.size+'|'+f.lastModified};const seen=(await IDB.get('dirSeen'))||{};await runDirImport([y],seen,`<div class="note">Reimportado: ${esc(x.p)}</div>`)}catch(e){alertMsg('Pasta: '+e.message)}})}
async function syncDir(){const b=$('#bDir');const t0=b.textContent;
  if(!DIR_OK){alertMsg('Para usar pastas conectadas, use o Chrome ou o Edge no computador.');return}
  try{const D=await getDirs();if(!D.length){if(M!=='imp'){location.href='rotina.html?m=imp';return}await addDir();return}
    b.textContent='Lendo pastas…';b.disabled=true;const seen=(await IDB.get('dirSeen'))||{};let all=[];const res=[];
    for(const h of D){if((await h.queryPermission({mode:'read'}))!=='granted'&&(await h.requestPermission({mode:'read'}))!=='granted'){res.push(`<div class="err">✗ Sem permissão para ler a pasta "${esc(h.name)}"</div>`);continue}
      const fs=(await dirFiles(h)).map(x=>({...x,p:h.name+'/'+x.p,dir:h.name}));all=all.concat(fs)}
    DIRALL=all;const novos=all.filter(x=>seen[x.p]!==x.k).sort((a,b)=>a.f.lastModified-b.f.lastModified);
    if(M!=='imp'){location.href='rotina.html?m=imp';return}UI.slide=SLIDES.findIndex(x=>x.id==='imp');render();const log=$('#impLog');const nomes=D.map(h=>`"${esc(h.name)}"`).join(', ');
    if(!novos.length){log.innerHTML=res.join('')+`<div class="ok">✓ Pastas ${nomes}: nenhum arquivo novo (${all.length} já importados).</div>`+dirTable(seen);bindDirTable();return}
    log.innerHTML=`Importando ${novos.length} arquivo(s) novo(s) de ${nomes}… (arquivos grandes podem levar alguns minutos)`;
    const por={};novos.forEach(x=>por[x.dir]=(por[x.dir]||0)+1);
    await runDirImport(novos,seen,res.join('')+`<div class="note" style="margin-bottom:4px">${Object.entries(por).map(([d,n])=>`Pasta "${esc(d)}": ${n} arquivo(s) novo(s) ou alterado(s)`).join(' · ')}</div>`)}
  catch(e){if(e.name!=='AbortError')alertMsg('Pasta: '+e.message)}finally{b.textContent=t0;b.disabled=false}}
$('#bDir').onclick=()=>syncDir();
function alertMsg(m){const el=$('#slide');if(el)el.insertAdjacentHTML('afterbegin',`<div class="cbox" style="padding:10px 14px;margin-bottom:10px;border-color:#E0141E">${esc(m)}</div>`)}


</script>
